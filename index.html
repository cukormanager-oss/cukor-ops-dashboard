<title>Cukor Group · Операційний огляд</title>
<style>
  :root{
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --border:rgba(11,11,11,.10); --accent:#2a78d6; --crit:#d03b3b;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--page); color:var(--ink); min-height:100vh; display:flex;
       align-items:center; justify-content:center; padding:24px; font-size:14px; line-height:1.45}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px;
        padding:32px; width:100%; max-width:380px; box-shadow:0 1px 2px rgba(11,11,11,.04)}
  .brandmark{display:inline-block; font-size:11px; font-weight:600; letter-spacing:.08em;
             text-transform:uppercase; color:var(--ink-2); border:1px solid var(--border);
             border-radius:6px; padding:3px 8px; margin-bottom:14px}
  h1{font-size:19px; font-weight:600; letter-spacing:-.01em; margin-bottom:6px}
  p.sub{font-size:13px; color:var(--muted); margin-bottom:20px}
  label{display:block; font-size:12px; color:var(--ink-2); margin-bottom:6px}
  input{width:100%; padding:10px 12px; font-size:14px; font-family:inherit; color:var(--ink);
        background:var(--page); border:1px solid var(--border); border-radius:8px; outline:none}
  input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(42,120,214,.12)}
  button{width:100%; margin-top:14px; padding:10px 12px; font-size:14px; font-weight:600;
         font-family:inherit; color:#fff; background:var(--ink); border:none; border-radius:8px; cursor:pointer}
  button:hover{background:#242322}
  button:disabled{opacity:.6; cursor:default}
  .err{margin-top:12px; font-size:12.5px; color:var(--crit); min-height:16px}
  .foot{margin-top:18px; font-size:11.5px; color:var(--muted); line-height:1.5}
</style>

<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const f = document.getElementById('f'), inp = document.getElementById('p'),
      btn = document.getElementById('b'), err = document.getElementById('e');

f.addEventListener('submit', async ev => {
  ev.preventDefault();
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Розшифровую…';
  try{
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(inp.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(D.salt), iterations:D.iter, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(D.iv)}, key, b64(D.ct));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }catch(_){
    err.textContent = 'Невірний пароль';
    btn.disabled = false; btn.textContent = 'Увійти';
    inp.select();
  }
});
</script>
